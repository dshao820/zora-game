<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="動物數字樂園" />
    <meta name="theme-color" content="#9fdcff" />
    <meta name="description" content="給 3 歲幼兒的數字、顏色、動物互動學習遊戲" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <title>動物數字樂園</title>
    <style>
      /* JS 載入前的開機畫面 */
      html, body { margin: 0; height: 100%; background: #cdeeff; }
      .boot { height: 100%; display: flex; align-items: center; justify-content: center; }
      .boot span { width: 22px; height: 22px; margin: 0 8px; border-radius: 50%; background: #ffb36b; animation: boot 1s infinite ease-in-out; }
      .boot span:nth-child(2) { background: #6bcb77; animation-delay: .15s; }
      .boot span:nth-child(3) { background: #4d96ff; animation-delay: .3s; }
      @keyframes boot { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-18px); } }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot"><span></span><span></span><span></span></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
